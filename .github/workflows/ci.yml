name: Application and security checks
on: [push, pull_request]
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # github reporter turns each failed test into a readable annotation; the HTML report is kept for failures.
      # DEMO_MODE gates every /demo route (AGENTS.md); the build step doesn't need it since app/demo/layout.tsx
      # is force-dynamic, so nothing under it is prerendered at build time.
      - run: npm run test:e2e -- --reporter=github,list,html
        env:
          DEMO_MODE: on
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.102.0
      - run: supabase start
      - run: supabase test db
