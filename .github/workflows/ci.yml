name: Application and security checks
on: [push, pull_request]
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # github reporter turns each failed test into a readable annotation; the HTML report is kept for failures.
      # DEMO_MODE gates every /demo route (AGENTS.md); the build step doesn't need it since app/demo/layout.tsx
      # is force-dynamic, so nothing under it is prerendered at build time.
      - run: npm run test:e2e -- --reporter=github,list,html
        env:
          DEMO_MODE: 'on'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.102.0
      - run: supabase start
      - run: supabase test db
  knowledge-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      # kb/ requires Node 24 (kb/package.json engines) and runs TypeScript directly.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: kb/pnpm-lock.yaml
      - run: pnpm --dir kb install --frozen-lockfile
      - run: pnpm --dir kb typecheck
      - run: pnpm --dir kb test
      # Every item against the schema, the topic taxonomy and the licence register. An unresolved
      # cite or an unknown licence fails here rather than reaching the corpus.
      - run: pnpm --dir kb validate
      - run: pnpm --dir kb build
      # dist/ is the only contract between kb/ and the app, so prove the app can still read what the
      # kb produces. The dry run writes nothing and needs no secrets.
      - run: npm ci
      - run: node scripts/ingest-kb.ts
        env:
          KB_DIST_DIR: kb/dist
